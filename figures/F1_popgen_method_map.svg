<text x="38" y="94" font-family="Source Sans 3, DejaVu Sans, sans-serif" font-size="11.5" fill="#2b3a45">tsinfer, Relate, tsdate (Wohns 2022;</text>
<text x="38" y="110" font-family="Source Sans 3, DejaVu Sans, sans-serif" font-size="11.5" fill="#2b3a45">Pope 2026 if default algorithm),</text>
<text x="38" y="126" font-family="Source Sans 3, DejaVu Sans, sans-serif" font-size="11.5" fill="#2b3a45">SINGER, tskit. No grape ARG here.</text>
<text x="38" y="142" font-family="Source Sans 3, DejaVu Sans, sans-serif" font-size="11.5" fill="#2b3a45">Map, μ and g [待确认].</text>
