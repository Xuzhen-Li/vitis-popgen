<text x="338" y="212" font-family="Source Sans 3, DejaVu Sans, sans-serif" font-size="14" font-weight="700" fill="#1f2a33">Graph / SV popgen</text>
<text x="338" y="232" font-family="Source Sans 3, DejaVu Sans, sans-serif" font-size="11.5" fill="#2b3a45">PanGenie and Giraffe papers.</text>
<text x="338" y="248" font-family="Source Sans 3, DejaVu Sans, sans-serif" font-size="11.5" fill="#2b3a45">Liu 2024 Grapepan v.1.0:</text>
<text x="338" y="264" font-family="Source Sans 3, DejaVu Sans, sans-serif" font-size="11.5" fill="#2b3a45">9,105,787 short; 236,449 SVs.</text>
<text x="338" y="280" font-family="Source Sans 3, DejaVu Sans, sans-serif" font-size="11.5" fill="#2b3a45">Guo 2025: 72 haplotype-resolved genomes.</text>
<rect x="628" y="190" width="280" height="118" rx="8" fill="#f7f4ee" stroke="#3d4f5f" stroke-width="1.4"/>
<text x="638" y="212" font-family="Source Sans 3, DejaVu Sans, sans-serif" font-size="14" font-weight="700" fill="#1f2a33">PGS and load</text>
<text x="638" y="232" font-family="Source Sans 3, DejaVu Sans, sans-serif" font-size="11.5" fill="#2b3a45">Human PGS portability cautions.</text>
<text x="638" y="248" font-family="Source Sans 3, DejaVu Sans, sans-serif" font-size="11.5" fill="#2b3a45">Grape load: Zhou 2017, +5.2%</text>
<text x="638" y="264" font-family="Source Sans 3, DejaVu Sans, sans-serif" font-size="11.5" fill="#2b3a45">(9 wild vs 18 cultivated ind.).</text>
<text x="638" y="280" font-family="Source Sans 3, DejaVu Sans, sans-serif" font-size="11.5" fill="#2b3a45">Arabidopsis/Ulmus are not grape.</text>
<rect x="178" y="328" width="580" height="100" rx="8" fill="#f7f4ee" stroke="#3d4f5f" stroke-width="1.4"/>
<text x="188" y="350" font-family="Source Sans 3, DejaVu Sans, sans-serif" font-size="14" font-weight="700" fill="#1f2a33">Vitis studies (claims kept side by side)</text>
<text x="188" y="370" font-family="Source Sans 3, DejaVu Sans, sans-serif" font-size="11.5" fill="#2b3a45">Dong 2023: two domestications ~11,000 ya (abstract; no 1-to-1 table/wine map).</text>
<text x="188" y="386" font-family="Source Sans 3, DejaVu Sans, sans-serif" font-size="11.5" fill="#2b3a45">Magris 2021: one Western Asian domestication + later introgression.</text>
<text x="188" y="402" font-family="Source Sans 3, DejaVu Sans, sans-serif" font-size="11.5" fill="#2b3a45">Xiao 2023: single domestication (not claimed as Western Asia here).</text>
