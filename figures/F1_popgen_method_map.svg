<text x="38" y="232" font-family="Source Sans 3, DejaVu Sans, sans-serif" font-size="11.5" fill="#2b3a45">FEEMS paper (wolves); EEMS only</text>
<text x="38" y="248" font-family="Source Sans 3, DejaVu Sans, sans-serif" font-size="11.5" fill="#2b3a45">as described there.</text>
