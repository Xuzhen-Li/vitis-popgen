<text x="638" y="94" font-family="Source Sans 3, DejaVu Sans, sans-serif" font-size="11.5" fill="#2b3a45">FLARE (abstract + README only),</text>
<text x="638" y="110" font-family="Source Sans 3, DejaVu Sans, sans-serif" font-size="11.5" fill="#2b3a45">MOSAIC, fineSTRUCTURE.</text>
