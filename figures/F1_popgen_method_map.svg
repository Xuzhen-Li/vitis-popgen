<text x="338" y="94" font-family="Source Sans 3, DejaVu Sans, sans-serif" font-size="11.5" fill="#2b3a45">hap-IBD (phased data + cM map),</text>
<text x="338" y="110" font-family="Source Sans 3, DejaVu Sans, sans-serif" font-size="11.5" fill="#2b3a45">RaPID2, RZooRoH 2026 update.</text>
